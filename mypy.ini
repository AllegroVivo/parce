[mypy]
python_version = 3.14
files = parce
warn_redundant_casts = True
warn_unused_ignores = True
enable_error_code = ignore-without-code, possibly-undefined
disallow_untyped_defs = True
disallow_incomplete_defs = True

# The one surviving exception: treebuilder's guard-implies-loop-runs shapes
# are false positives possibly-undefined cannot follow (see the typing
# campaign's notes; the invariants are asserted in the code where provable).
[mypy-parce.treebuilder]
disable_error_code = possibly-undefined
